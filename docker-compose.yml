services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
    # Note: strict-ssl=false is a workaround for SSL certificate issues in restricted networks
    # Remove this if you have proper SSL certificates configured
    command: sh -c "npm config set strict-ssl false && npm install && npm run dev -- --host 0.0.0.0"
    stdin_open: true
    tty: true

volumes:
  node_modules:
